<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Teacher Wage System - Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { display: flex; height: 100vh; background: #f5f7fa; overflow: hidden; }
        
        /* Sidebar Styles */
        .vertical-navbar { width: 250px; background: linear-gradient(180deg, #1a237e 0%, #283593 100%); color: white; display: flex; flex-direction: column; }
        .logo-container { padding: 30px 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .nav-menu { list-style: none; padding: 20px 0; flex-grow: 1; }
        .nav-item { margin: 5px 10px; }
        .nav-link { display: flex; align-items: center; padding: 15px; color: white; text-decoration: none; border-radius: 8px; transition: 0.3s; }
        .nav-link:hover, .nav-link.active { background: rgba(0, 200, 83, 0.2); border-left: 4px solid #00c853; }
        .nav-link i { margin-right: 12px; width: 20px; }

        /* Content Area */
        .main-container { flex: 1; display: flex; flex-direction: column; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <nav class="vertical-navbar">
        <div class="logo-container"><h2>Teacher Wage</h2></div>
        <ul class="nav-menu">
             
            <li class="nav-item"><a href="teacherdetails.html" target="contentFrame" class="nav-link"><i class="fas fa-clipboard-check"></i> teacher Details</a></li>
            <li class="nav-item"><a href="attendance.html" target="contentFrame" class="nav-link"><i class="fas fa-clipboard-check"></i> Teacher-Attendance</a></li>
            <li class="nav-item"><a href="vetan.html" target="contentFrame" class="nav-link active"><i class="fas fa-user-tie"></i> Teachers-Vetan</a></li>
           
        <li class="nav-item"><a href="studytalent.html" target="contentFrame" class="nav-link active"><i class="fas fa-user-tie"></i> Teachers-Talent</a></li>
         
          <li class="nav-item"><a href="studentfees.html" target="contentFrame" class="nav-link active"><i class="fas fa-user-tie"></i> studentfees</a></li>
            
          


           <li class="nav-item"><a href="wage-calc.html" target="contentFrame" class="nav-link"><i class="fas fa-calculator"></i> Wage Calc</a></li>
            <li class="nav-item"><a href="reports.html" target="contentFrame" class="nav-link"><i class="fas fa-file-alt"></i> Reports</a></li>
        
        


            <li class="nav-item"><a href="teachers.html" target="contentFrame" class="nav-link active"><i class="fas fa-user-tie"></i> Teachers</a></li>
        </ul>
    </nav>
    <div class="main-container">
        <iframe name="contentFrame" src="teachers.html"></iframe>
    </div>

    <script>
        // Active Class switcher
        const links = document.querySelectorAll('.nav-link');
        links.forEach(link => {
            link.addEventListener('click', function() {
                links.forEach(l => l.classList.remove('active'));
                this.classList.add('active');
            });
        });
    </script>
</body>
</html>
